############################# announcement / attention callout ##############################
# type: info | warning | action  (controls the badge/icon/color shown for each item)
# Wrap dates/deadlines in <strong>...</strong> so they stand out.
# Bump `version` to re-show this notice to visitors who already dismissed it, even if the
# wording doesn't change (dismissal is otherwise auto-invalidated whenever title/version/items change).
# After adding/editing an item here, optionally send a push notification to subscribers from the
# OneSignal dashboard (Messages > New Push) - see "Push notifications" in README.md. Not automatic.
notice:
  enable: true
  version: 1
  title: "Announcements"
  items:
    - type: info
      text: "AI Workshop registrants: it is important to join the WhatsApp group shared in your confirmation email, as it is used for meeting links and other useful information."
    - type: action
      text: "Drawing Contest and \"Little Voices, Big Questions\" registrants have been emailed instructions for uploading their submissions through the Submission Portal."
    - type: warning
      text: "Singing registration closes at <strong>5:00 PM CST on August 28, 2026</strong>."
    - type: action
      text: "The deadline for Drawing Contest and \"Little Voices, Big Questions\" submissions is <strong>September 11, 2026</strong>."
