############################# announcement / attention callout ##############################
# type: info | warning | action  (controls the badge/icon/color shown for each item)
# Wrap dates/deadlines in <strong>...</strong> so they stand out.
# Bump `version` to re-show this notice to visitors who already dismissed it, even if the
# wording doesn't change (dismissal is otherwise auto-invalidated whenever title/version/items change).
# After adding/editing an item here, optionally send a push notification to subscribers from the
# OneSignal dashboard (Messages > New Push) - see "Push notifications" in README.md. Not automatic.
notice:
  enable: true
  version: 6
  title: "Announcements"
  items:
    - type: action
      text: "<strong>Join us LIVE on Zoom — Periyar 148 Birthday Celebration, Saturday, September 19, 2026 at 10:00 AM Eastern Time (US &amp; Canada).</strong> <a href=\"https://us06web.zoom.us/j/7039026539?pwd=IA9fSbMKNHrW3ckkSgyo0XNW1O1iZ5.1&amp;omn=88041797837\" target=\"_blank\" rel=\"noopener\"><strong>Join Zoom Meeting</strong></a> &middot; Meeting ID: <strong>703 902 6539</strong>"
    - type: info
      text: "Support Periyar International with a quick donation via Zelle — just scan the QR code on our <a href=\"/blog/support-donate-now/\">Donate Now page</a>."
    - type: info
      text: "Registration and submissions are now officially closed — thank you to everyone who took part in Singing, the Drawing Contest, \"Little Voices, Big Questions,\" and the AI Theme Song &amp; Video Challenge! Winners will be announced at the Periyar 148 Birthday Celebration on <strong>September 19, 2026</strong>."
