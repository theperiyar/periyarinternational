############################# announcement / attention callout ##############################
# type: info | warning | action  (controls the badge/icon/color shown for each item)
# Wrap dates/deadlines in <strong>...</strong> so they stand out.
# Bump `version` to re-show this notice to visitors who already dismissed it, even if the
# wording doesn't change (dismissal is otherwise auto-invalidated whenever title/version/items change).
# After adding/editing an item here, optionally send a push notification to subscribers from the
# OneSignal dashboard (Messages > New Push) - see "Push notifications" in README.md. Not automatic.
notice:
  enable: true
  version: 3
  title: "Announcements"
  items:
    - type: info
      text: "The AI Workshop is complete! Watch the recording, download the slides, and learn how to submit your video on the <a href=\"/blog/ai-workshop-recap/\">AI Workshop Recap page</a>."
    - type: warning
      text: "Due to the overwhelming response, Singing registration is now closed. Registration remains open for the <a href=\"/blog/drawing-competition/\">Drawing Contest</a> and <a href=\"/blog/ask-the-chief-guest/\">\"Little Voices, Big Questions\" — Ask a Question</a>."
    - type: action
      text: "Participants in the Drawing Contest and \"Little Voices, Big Questions\" have been emailed instructions for uploading their submissions through the Submission Portal."
    - type: action
      text: "All submissions are due by <strong>September 11, 2026</strong>. For complete details, visit the <a href=\"/blog/ai-challenge-faq/\">AI Challenge FAQ</a>."
