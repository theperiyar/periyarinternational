{{ $data := index site.Data site.Language.Lang }}

{{ if $data.notice.notice.enable }}
{{ with $data.notice.notice }}
{{"<!-- Start Notice/Announcement Callout -->" | safeHTML}}
<section class="notice-callout">
	<div class="container">
		<div class="notice-callout-box">
			<div class="notice-callout-icon"><i class="ti-announcement"></i></div>
			<div class="notice-callout-content">
				{{ if .title }}<h3>{{ .title }}</h3>{{ end }}
				<ul>
					{{ range .items }}
					<li>{{ . | safeHTML }}</li>
					{{ end }}
				</ul>
			</div>
		</div>
	</div>
</section>
<style>
	.notice-callout {
		padding: 24px 0;
	}
	.notice-callout-box {
		display: flex;
		align-items: flex-start;
		gap: 16px;
		background-color: #FFF8E6;
		border: 1px solid #F0D999;
		border-left: 5px solid #57cbcc;
		border-radius: 10px;
		padding: 20px 24px;
	}
	.notice-callout-icon {
		flex: 0 0 auto;
		width: 40px;
		height: 40px;
		display: flex;
		align-items: center;
		justify-content: center;
		border-radius: 50%;
		background-color: #57cbcc;
		color: #ffffff;
		font-size: 18px;
	}
	.notice-callout-content h3 {
		margin: 0 0 10px;
		font-size: 18px;
		font-weight: 700;
		color: #292F36;
	}
	.notice-callout-content ul {
		margin: 0;
		padding: 0;
		list-style: none;
	}
	.notice-callout-content li {
		position: relative;
		padding-left: 18px;
		margin-bottom: 8px;
		font-size: 15px;
		line-height: 1.6;
		color: #4e595f;
	}
	.notice-callout-content li:last-child {
		margin-bottom: 0;
	}
	.notice-callout-content li::before {
		content: "";
		position: absolute;
		left: 0;
		top: 9px;
		width: 6px;
		height: 6px;
		border-radius: 50%;
		background-color: #57cbcc;
	}
	@media (max-width: 575px) {
		.notice-callout-box {
			flex-direction: column;
		}
	}
</style>
{{"<!-- /Notice/Announcement Callout -->" | safeHTML}}
{{ end }}
{{ end }}
